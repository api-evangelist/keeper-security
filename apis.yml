name: Keeper Security

description: Keeper Security is a zero-knowledge cybersecurity company providing an enterprise password manager, privileged access management
  (KeeperPAM), secrets management, and dark-web monitoring. For developers, Keeper exposes Keeper Secrets Manager (KSM) — a cloud-based, zero-knowledge
  platform for securing infrastructure secrets such as API keys, database passwords, and certificates — through a multi-language SDK family (Python,
  JavaScript/Node, Java/Kotlin, .NET, Go) and the Keeper Commander and KSM command-line interfaces. Keeper does not publish a public REST OpenAPI;
  integration happens via these SDKs/CLIs, a Commander Service Mode REST API, Terraform providers, and CI/CD plugins. Keeper is FedRAMP High and
  SOC 2 Type 2 certified with ISO 27001/27017/27018, FIPS 140-3, PCI DSS Level 1, HIPAA, and GDPR compliance.

